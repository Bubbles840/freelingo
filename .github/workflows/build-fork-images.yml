# Fork: build the fork's images on GitHub and publish them to GHCR, so the
# home server can `docker compose pull` instead of anyone building locally.
#
# Publishes ghcr.io/bubbles840/freelingo-{backend,frontend}:fork for linux/amd64
# (the server's architecture) on every push to fork-features, plus a
# <short-sha> tag for pinning/rollback. Also runnable by hand from the
# Actions tab.
#
# Auth: GITHUB_TOKEN works once the two packages grant this repo write access
# (package settings → Manage Actions access). Until then — or instead — add a
# repo secret GHCR_PAT (classic PAT, write:packages) and it is used first.
name: Build fork images

on:
  push:
    branches:
      - fork-features
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/freelingo-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/freelingo-frontend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            # The frontend Dockerfile copies both frontend/ and messages/, so
            # its context is the repo root.
            context: .
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - id: sha
        run: echo "short-sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner for GHCR
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/freelingo-${{ matrix.image.name }}:fork
            ghcr.io/${{ steps.owner.outputs.owner }}/freelingo-${{ matrix.image.name }}:${{ steps.sha.outputs.short-sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
